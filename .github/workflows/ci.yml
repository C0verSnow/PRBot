name: Test and build macOS DMG
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      acceptance:
        description: Run real providers with temporary acceptance credentials
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.acceptance && 'providers' || 'checks' }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run build --prefix frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check src tests
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-bundle
          path: frontend/dist
      - name: Check React window before packaging (remote only)
        run: |
          PYTHONPATH=src PRBOT_UI_CHECK_OUTPUT="$RUNNER_TEMP/PRBot-source-ui.png" python -m prbot.main ui-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-ui-evidence
          path: |
            ${{ runner.temp }}/PRBot-source-ui*.png
            ${{ runner.temp }}/PRBot-source-ui.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
  dmg:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run build --prefix frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: bash scripts/build_dmg.sh
      - run: bash scripts/verify_dmg.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PRBot-ui-evidence
          path: |
            dist/PRBot-ui*.png
            dist/PRBot-ui.json
      - run: python -m pip freeze > dist/build-dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PRBot-v0.1.0-macos-arm64-development
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/PRBot-v0.1.0-macos-arm64.dmg
            dist/SHA256SUMS
            dist/build-dependencies.txt
            dist/PRBot-ui*.png
            dist/PRBot-ui.json
            README.md
            docs/Issue23-DMG打包修复.md

  acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance
    needs: [test, dmg]
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify real providers and Full Access (remote only)
        env:
          PRBOT_ACCEPTANCE_BOOTSTRAP: ${{ secrets.PRBOT_ACCEPTANCE_BOOTSTRAP }}
          PRBOT_ACCEPTANCE_CODEX_AUTH: ${{ secrets.PRBOT_ACCEPTANCE_CODEX_AUTH }}
          INFISICAL_URL: ${{ secrets.INFISICAL_URL }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_ENVIRONMENT: ${{ secrets.INFISICAL_ENVIRONMENT }}
          INFISICAL_SECRET_PATH: ${{ secrets.INFISICAL_SECRET_PATH }}
          PRBOT_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/provider-evidence.json
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m prbot.main provider-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-evidence
          path: ${{ runner.temp }}/provider-evidence.json
