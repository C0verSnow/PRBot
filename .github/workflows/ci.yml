name: Test and build macOS DMG
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check src tests
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
  dmg:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: bash scripts/build_dmg.sh
      - run: bash scripts/verify_dmg.sh
      - run: python -m pip freeze > dist/build-dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PRBot-v0.1.0-macos-arm64-development
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/PRBot-v0.1.0-macos-arm64.dmg
            dist/SHA256SUMS
            dist/build-dependencies.txt
            使用手册.md
            docs/验收记录.md
